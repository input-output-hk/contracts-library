file = "./main.tx3"

# Happy-path scenario for the settings protocol: launch -> propose -> apply ->
# close. It mirrors the MeshJS end-to-end suite in
# `offchain/meshjs/e2e/test/settings.e2e.test.ts`.
#
# Two `env` values are deployment-specific and must be supplied per profile:
#   - settings_hash   : the blake2b-224 hash of the fully-applied validator
#                       (its policy id / script credential).
#   - settings_script : the fully-applied Plutus V3 script bytes.
# Both depend on the mint `seed` UTxO the validator is parameterized with, so
# they are produced when the instance is deployed (see the MeshJS `settingsScript`
# helper) and injected here through the active env profile.
#
# UtxoRef arguments (`seed`, `settings_ref`) reference on-chain UTxOs created by
# earlier steps and are resolved at run time; the placeholders below name the
# producing step.
[env]
settings_hash = "4829c5417ff3b8803091bc4825c263d3eeed7756201f4494167ec609"
settings_script = "@settings_script"
apply_delay = 4000

[[wallets]]
name = "applier"
balance = 100000000

[[wallets]]
name = "proposer"
balance = 100000000

# 1. Launch: the applier mints the settings NFT and creates the state UTxO with
#    an initial value of 1 and no pending proposal.
[[transactions]]
description = "applier launches the settings instance (value = 1)"
template = "launch"
signers = ["applier"]
wait_block = true
args = { seed = "@applier_seed", initial_value = 1, out_ix = 0 }

# 2. Propose: the proposer records a new value (2). next_apply is set to
#    now + apply_delay by the template.
[[transactions]]
description = "proposer proposes a new value (2)"
template = "propose"
signers = ["proposer"]
wait_block = true
args = { settings_ref = "@launch#0", new_value = 2, now_ms = 0, since_slot = 0, out_ix = 0 }

# 3. Apply: after apply_delay elapses, the applier promotes the proposed value
#    to current.
[[transactions]]
description = "applier applies the matured proposal (current = 2)"
template = "apply"
signers = ["applier"]
wait_block = true
args = { settings_ref = "@propose#0", new_current = 2, since_slot = 0, out_ix = 0 }

# 4. Close: the applier burns the NFT and recovers the locked lovelace.
[[transactions]]
description = "applier closes the settings instance"
template = "close"
signers = ["applier"]
wait_block = true
args = { settings_ref = "@apply#0" }

# After the round trip the proposer only pays fees for the propose step, and the
# applier pays the launch/apply/close fees but recovers the locked min-ada on
# close, so both wallets end just below their starting balance.
[[expect]]
type = "Balance"
from = "proposer"

[[expect.min_amount]]
amount = 99000000

[[expect]]
type = "Balance"
from = "applier"

[[expect.min_amount]]
amount = 98000000
