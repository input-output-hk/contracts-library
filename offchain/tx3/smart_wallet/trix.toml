[protocol]
name = "smart-wallet"
scope = ""
version = "0.1.0"
description = "Smart wallet: configurable M-of-N wallet with delegated withdraw-0 restrictions (core lifecycle)."
main = "main.tx3"

[ledger]
family = "cardano"

# Generated client lives OUTSIDE `.tx3/`: that directory is trix's runtime
# node state, which the test harness wipes on every boot for a fresh chain.
[[codegen]]
plugin = "ts-client"
output_dir = "codegen/ts-client"
