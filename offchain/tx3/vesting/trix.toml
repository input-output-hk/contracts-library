[protocol]
name = "linear-vesting"
scope = ""
version = "0.1.0"
description = "Linear vesting: lock a bundle for a beneficiary on a fixed schedule, with locker recovery after the vesting ends."
main = "main.tx3"

[ledger]
family = "cardano"

# Generated client lives OUTSIDE `.tx3/`: that directory is trix's runtime
# node state, which the test harness wipes on every boot for a fresh chain.
[[codegen]]
plugin = "ts-client"
output_dir = "codegen/ts-client"