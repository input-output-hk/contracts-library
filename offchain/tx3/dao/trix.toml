[protocol]
name = "dao-governance"
scope = ""
version = "0.1.0"
description = "DAO governance: token-weighted proposal lifecycle (stake, proposal, vote) driven by a settings instance."
main = "main.tx3"

[ledger]
family = "cardano"

# Generated client lives OUTSIDE `.tx3/`: that directory is trix's runtime
# node state, which the test harness wipes on every boot for a fresh chain.
[[codegen]]
plugin = "ts-client"
output_dir = "codegen/ts-client"
