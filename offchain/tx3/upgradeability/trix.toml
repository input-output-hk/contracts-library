[protocol]
name = "upgradeability"
scope = ""
version = "0.1.0"
description = "Upgradeability: forced beacon indirection and opt-in migration over a governed settings registry."
main = "main.tx3"

[ledger]
family = "cardano"

# Generated client lives OUTSIDE `.tx3/`: that directory is trix's runtime
# node state, which the test harness wipes on every boot for a fresh chain.
[[codegen]]
plugin = "ts-client"
output_dir = "codegen/ts-client"
