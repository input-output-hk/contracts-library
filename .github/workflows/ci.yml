name: CI

# PRs to any branch run the full suite, but runs not targeting main are
# advisory: continue-on-error on every job reports a failure as
# success-with-annotation instead of blocking the merge.
on:
  push:
    branches: [main]
  pull_request:

# New pushes cancel stale runs of the same branch (a full tx3 run takes ~41 min).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format & lint (biome) + aiken fmt
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' && github.base_ref != 'main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: aiken-lang/setup-aiken@v1
        with:
          version: v1.1.24
      - name: Install
        run: just install root
      - name: Format & lint
        run: |
          just fmt-check
          just lint
  onchain:
    name: On-chain (aiken)
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' && github.base_ref != 'main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: aiken-lang/setup-aiken@v1
        with:
          version: v1.1.24
      # Cache fetched Aiken dependencies (the analog of node_modules), keyed on
      # the resolved lockfile so a dependency bump invalidates it.
      - name: Cache Aiken packages
        uses: actions/cache@v4
        with:
          path: onchain/build/packages
          key: ${{ runner.os }}-aiken-${{ hashFiles('onchain/aiken.lock') }}
          restore-keys: |
            ${{ runner.os }}-aiken-
      - name: On-chain checks
        run: just onchain

  offchain-unit:
    name: Off-chain unit (MeshJS lib)
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' && github.base_ref != 'main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: offchain/meshjs/lib/package-lock.json
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # Fails the job when the pinned blueprints drift from onchain/plutus.json
      # (plain node — no dependencies needed for this step).
      - name: Blueprint sync check
        run: just blueprints-check
      - name: Install
        run: just install lib
      - name: Typecheck & unit tests
        run: just unit

  e2e:
    name: Off-chain e2e (Yaci devnet)
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' && github.base_ref != 'main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: offchain/meshjs/*/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Build library
        run: just build

      - name: Install e2e deps
        run: just install e2e

      # The recipe sets REQUIRE_DEVNET=1 (fail instead of silently skipping),
      # typechecks, then starts an ephemeral devnet per suite and always tears
      # it down.
      - name: Typecheck & run e2e against an ephemeral devnet
        run: just e2e

  tx3-devnet:
    name: Off-chain tx3 (trix devnet)
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' && github.base_ref != 'main' }}
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            offchain/meshjs/lib/package-lock.json
            offchain/meshjs/e2e/package-lock.json
            offchain/tx3/package-lock.json

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      # The suites drive an ephemeral dolos devnet booted by `trix devnet`
      # (see offchain/tx3/README.md). The tx3up installer + toolchain release
      # pins live in the `tx3-toolchain` recipe — bump there, then re-run the
      # devnet suites.
      - name: Install the tx3 toolchain (trix, dolos)
        run: just tx3-toolchain

      - name: Build library
        run: just build

      - name: Install MeshJS e2e dependencies (vendored CIP-113 helpers)
        run: just install e2e

      - name: Generate TypeScript clients (gitignored — absent on a fresh checkout)
        run: just tx3-codegen

      - name: Install tx3 dependencies
        run: just install tx3

      # The recipe enforces dolos >= 1.4.0 (older dolos injects Plutus
      # POSIXTime in seconds — see offchain/tx3/README.md), typechecks, then
      # boots one ephemeral dolos devnet per suite, serially (fixed ports),
      # always tearing down.
      - name: Typecheck & run devnet suites
        run: just tx3
