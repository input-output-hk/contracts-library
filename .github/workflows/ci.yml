name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# New pushes cancel stale runs of the same branch (a full tx3 run takes ~41 min).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format & lint (biome) + aiken fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: aiken-lang/setup-aiken@v1
        with:
          version: v1.1.24
      - name: Format & lint
        run: |
          just fmt-check
          just lint
  onchain:
    name: On-chain (aiken)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: aiken-lang/setup-aiken@v1
        with:
          version: v1.1.24
      # Cache fetched Aiken dependencies (the analog of node_modules), keyed on
      # the resolved lockfile so a dependency bump invalidates it.
      - name: Cache Aiken packages
        uses: actions/cache@v4
        with:
          path: onchain/build/packages
          key: ${{ runner.os }}-aiken-${{ hashFiles('onchain/aiken.lock') }}
          restore-keys: |
            ${{ runner.os }}-aiken-
      - name: On-chain checks
        run: just onchain

  offchain-unit:
    name: Off-chain unit (MeshJS lib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: offchain/meshjs/lib/package-lock.json
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # Fails the job when the pinned blueprints drift from onchain/plutus.json
      # (plain node — no dependencies needed for this step).
      - name: Blueprint sync check
        run: just blueprints-check
      - name: Install
        working-directory: offchain/meshjs/lib
        run: npm ci
      - name: Typecheck & unit tests
        run: just unit

  e2e:
    name: Off-chain e2e (Yaci devnet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: offchain/meshjs/*/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Build library
        working-directory: offchain/meshjs/lib
        run: npm ci && npm run build

      - name: Install e2e deps
        working-directory: offchain/meshjs/e2e
        run: npm ci

      # The recipe sets REQUIRE_DEVNET=1 (fail instead of silently skipping),
      # typechecks, then starts an ephemeral devnet per suite and always tears
      # it down.
      - name: Typecheck & run e2e against an ephemeral devnet
        run: just e2e

  tx3-devnet:
    name: Off-chain tx3 (trix devnet)
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            offchain/meshjs/lib/package-lock.json
            offchain/meshjs/e2e/package-lock.json
            offchain/tx3/package-lock.json

      # The suites drive an ephemeral dolos devnet booted by `trix devnet`
      # (see offchain/tx3/README.md). tx3up installs the toolchain under
      # ~/.tx3/<toolchain>/bin.
      #
      # Both layers are pinned so a toolchain release cannot silently change
      # what CI runs: the tx3up installer at its release tag, and the
      # toolchain manifest via `tx3up install --release` (tx3-lang/toolchain
      # tags; this one ships trix ^0.28.0, dolos ^1.6.1). Bump deliberately,
      # then re-run the devnet suites.
      - name: Install the tx3 toolchain (trix, dolos)
        run: |
          curl -LsSf https://github.com/tx3-lang/tx3up/releases/download/v0.8.0/tx3up-installer.sh | sh
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
          tx3up install --release sha-3f2296a
          for d in "$HOME"/.tx3/*/bin; do [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"; done

      # dolos < 1.4.0 injects Plutus POSIXTime in seconds during mempool
      # validation, so time-dependent validators fail cryptically
      # (see offchain/tx3/README.md).
      - name: Guard dolos >= 1.4.0
        run: |
          version="$(dolos --version | grep -oE '[0-9]+(\.[0-9]+)+' | head -n1)"
          echo "dolos $version"
          if [ "$(printf '%s\n' "1.4.0" "$version" | sort -V | head -n1)" != "1.4.0" ]; then
            echo "::error::dolos $version < 1.4.0 — upgrade it (see offchain/tx3/README.md, dolos version requirement)"
            exit 1
          fi

      - name: Build library
        working-directory: offchain/meshjs/lib
        run: npm ci && npm run build

      - name: Install MeshJS e2e dependencies (vendored CIP-113 helpers)
        working-directory: offchain/meshjs/e2e
        run: npm ci

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Generate TypeScript clients (gitignored — absent on a fresh checkout)
        run: just tx3-codegen

      - name: Install tx3 dependencies
        working-directory: offchain/tx3
        run: npm ci

      # The recipe typechecks, then boots one ephemeral dolos devnet per
      # suite, serially (fixed ports), always tearing down.
      - name: Typecheck & run devnet suites
        run: just tx3
