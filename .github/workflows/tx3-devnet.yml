name: Tx3 devnet (nightly)

# The tx3 devnet suites take ~45 min, so they run nightly and on demand
# instead of on every PR (they used to gate PRs as the longest ci.yml job).
# Touching offchain/tx3 or the shared builders? Run them before merging:
# Actions → "Tx3 devnet (nightly)" → Run workflow, or
# `gh workflow run tx3-devnet.yml --ref <branch>`.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tx3-devnet:
    name: Off-chain tx3 devnet suites
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            offchain/meshjs/lib/package-lock.json
            offchain/meshjs/e2e/package-lock.json
            offchain/tx3/package-lock.json

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      # The suites drive an ephemeral dolos devnet booted by `trix devnet`
      # (see offchain/tx3/README.md). The tx3up installer + toolchain release
      # pins live in the `tx3-toolchain` recipe — bump there, then re-run the
      # devnet suites.
      - name: Install the tx3 toolchain (trix, dolos)
        run: just tx3-toolchain

      - name: Build library
        run: just build

      - name: Install MeshJS e2e dependencies (vendored CIP-113 helpers)
        run: just install e2e

      - name: Generate TypeScript clients (gitignored — absent on a fresh checkout)
        run: just tx3-codegen

      - name: Install tx3 dependencies
        run: just install tx3

      # The recipe enforces dolos >= 1.4.0 (older dolos injects Plutus
      # POSIXTime in seconds — see offchain/tx3/README.md), typechecks, then
      # boots one ephemeral dolos devnet per suite, serially (fixed ports),
      # always tearing down.
      - name: Typecheck & run devnet suites
        run: just tx3
